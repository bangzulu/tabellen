name: Täckningskontroll
# Körs bara manuellt för att spara kvot: 1 statisk nedladdning per dygn (cachas) + 2 realtidsanrop.
on:
  workflow_dispatch:
jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GTFS_STATIC_KEY: ${{ secrets.GTFS_STATIC_KEY }}
      GTFS_RT_KEY: ${{ secrets.GTFS_RT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: day
        run: echo "date=$(TZ=Europe/Stockholm date +%F)" >> "$GITHUB_OUTPUT"
      - name: Statisk GTFS från cache (en nedladdning per dygn)
        uses: actions/cache@v4
        with:
          path: data/sl.zip
          key: sl-zip-${{ steps.day.outputs.date }}
          restore-keys: sl-zip-
      - name: Kör täckningskontroll
        run: |
          python scripts/coverage_check.py 2>&1 | grep -v " INFO " | tee coverage.txt
          { echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Spara flödena för offline-utveckling
        uses: actions/upload-artifact@v4
        with:
          name: realtidsfloden
          path: data/*.pb
          retention-days: 7
