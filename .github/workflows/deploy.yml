name: Deploy till Fly
# Skapar appen första gången, för över Trafiklab-nycklarna från GitHub-secrets och deployar.
# Kräver secret FLY_API_TOKEN (organisationstoken från Flys webbgränssnitt).
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m pytest -q
      - if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN saknas – hoppar över deploy."
      - if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Skapa appen om den inte finns
        if: env.FLY_API_TOKEN != ''
        run: |
          APP=$(grep -E '^app *=' fly.toml | cut -d'"' -f2)
          flyctl status -a "$APP" >/dev/null 2>&1 || flyctl apps create "$APP" --org personal
      - name: För över Trafiklab-nycklar
        if: env.FLY_API_TOKEN != ''
        run: flyctl secrets set --stage GTFS_STATIC_KEY="$GTFS_STATIC_KEY" GTFS_RT_KEY="$GTFS_RT_KEY"
        env:
          GTFS_STATIC_KEY: ${{ secrets.GTFS_STATIC_KEY }}
          GTFS_RT_KEY: ${{ secrets.GTFS_RT_KEY }}
      - if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
      - name: Se till att appen har publika IP-adresser
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl ips list
          flyctl ips list --json | grep -q '"v4"\|shared_v4' || flyctl ips allocate-v4 --shared
          flyctl ips list --json | grep -q '"v6"' || flyctl ips allocate-v6
          flyctl ips list
      - name: Kontrollera att sidan svarar
        if: env.FLY_API_TOKEN != ''
        run: |
          APP=$(grep -E '^app *=' fly.toml | cut -d'"' -f2)
          flyctl status
          for i in $(seq 1 12); do
            if curl -fsS --max-time 30 "https://$APP.fly.dev/api/health"; then echo; exit 0; fi
            sleep 10
          done
          flyctl logs --no-tail | tail -50
          exit 1
