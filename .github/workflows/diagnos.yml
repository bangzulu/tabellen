name: Diagnos
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diagnos.yml"]
jobs:
  diagnos:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: HTTP
        run: |
          H=tabellen.fly.dev
          for p in /api/health "/api/board" "/api/bus" /; do
            out=$(curl -sS --max-time 100 -H "Accept-Encoding: gzip" --compressed -o body.txt -w "%{http_code} %{time_total}s" "https://$H$p" 2>&1)
            echo "::notice title=HTTP $p::$out $(head -c 200 body.txt | tr '\n' ' ')"
          done
      - name: Störningar per flik
        run: |
          sleep 60  # SL Deviations hämtas högst en gång per minut efter start
          curl -sS --max-time 100 --compressed "https://tabellen.fly.dev/api/board" -o board.json
          python3 - <<'PY'
          import json
          d = json.load(open("board.json"))
          print(f"::notice title=Källa::{d.get('alerts_source')} uppdaterad {d.get('alerts_timestamp')}")
          for c, t in d["tabs"].items():
              a = t["alerts"]
              tr = "; ".join(("AKUT " if x["acute"] else "plan ") + x["title"][:60] for x in a["traffic"])
              print(f"::notice title={c} märke {a['count']}::{tr} | hiss {len(a['access'])} | övr {len(a['info'])} | turer {len(a['trips'])}")
          for m in d["overview"]["modes"]:
              print(f"::notice title=Läge {m['code']}::{m['status']} {m['count']}/{m['planned']} sena3 {m['late3']} sena5 {m['late5']} max {m['max']}")
          b = d["tabs"].get("BAT")
          if b:
              print("::notice title=Båtlinjer::" + "; ".join(f"{l['line']} {l.get('planned')}" for l in b["lines"]))
          PY
      - name: Fly-status och loggar
        run: |
          echo "::notice title=Status::$(flyctl status -a tabellen 2>&1 | tr '\n' ' ' | head -c 900)"
          flyctl logs -a tabellen --no-tail > logs.txt 2>&1 || true
          sed 's/\x1b\[[0-9;]*m//g' logs.txt | grep -E "fp|Statisk|static|Laddar|Error|error|Killed|memory|oom|OOM|exited|Booting|Traceback|raise" \
            | grep -v "Connection reset" | sed -E 's/^.*app\[[0-9a-f]+\] arn \[info\]//' | tail -c 6000 > f.txt
          head -c 3000 f.txt | tr '\n' '|' > l2.txt
          tail -c +3001 f.txt | tr '\n' '|' > l1.txt
          echo "::notice title=Filtrerade loggar 1::$(cat l2.txt)"
          echo "::notice title=Filtrerade loggar 2::$(cat l1.txt)"
          echo "::notice title=Minne::$(flyctl ssh console -a tabellen -C 'sh -c "free -m; ls -la /data; ps aux | head -5"' 2>&1 | tr '\n' '|' | head -c 2000)"
