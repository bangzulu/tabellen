name: Diagnos
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diagnos.yml"]
jobs:
  diagnos:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: HTTP
        run: |
          H=tabellen.fly.dev
          for p in /api/health "/api/board" "/api/bus" /; do
            out=$(curl -sS --max-time 100 -H "Accept-Encoding: gzip" --compressed -o body.txt -w "%{http_code} %{time_total}s" "https://$H$p" 2>&1)
            echo "::notice title=HTTP $p::$out $(head -c 200 body.txt | tr '\n' ' ')"
          done
      - name: Fly-status och loggar
        run: |
          echo "::notice title=Status::$(flyctl status -a tabellen 2>&1 | tr '\n' ' ' | head -c 900)"
          flyctl logs -a tabellen --no-tail > logs.txt 2>&1 || true
          sed 's/\x1b\[[0-9;]*m//g' logs.txt | grep -E "fp|Statisk|static|Laddar|Error|error|Killed|memory|oom|OOM|exited|Booting|Traceback|raise" \
            | grep -v "Connection reset" | sed -E 's/^.*app\[[0-9a-f]+\] arn \[info\]//' | tail -c 6000 > f.txt
          head -c 3000 f.txt | tr '\n' '|' > l2.txt
          tail -c +3001 f.txt | tr '\n' '|' > l1.txt
          echo "::notice title=Filtrerade loggar 1::$(cat l2.txt)"
          echo "::notice title=Filtrerade loggar 2::$(cat l1.txt)"
          echo "::notice title=Minne::$(flyctl ssh console -a tabellen -C 'sh -c "free -m; ls -la /data; ps aux | head -5"' 2>&1 | tr '\n' '|' | head -c 2000)"
