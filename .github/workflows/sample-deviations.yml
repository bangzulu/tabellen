name: Exempel från SL Deviations
# Hämtar ett exempel på störningsmeddelanden från SL Deviations (ingen nyckel) för analys.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/sample-deviations.yml"]
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS --compressed "https://deviations.integration.sl.se/v1/messages?future=false" -o deviations.json
          python3 - <<'PY'
          import json, collections
          d = json.load(open("deviations.json"))
          def lines(x): return (x.get("scope") or {}).get("lines") or []
          pr = collections.Counter()
          for x in d:
              p = x.get("priority") or {}
              m = sorted({l.get("transport_mode") for l in lines(x)}) or ["-"]
              pr[(",".join(m), p.get("importance_level"), p.get("influence_level"), p.get("urgency_level"))] += 1
          print("::notice title=Prioritet (läge, imp, infl, urg)::" + "; ".join(f"{k}={v}" for k, v in pr.most_common()))
          cats = collections.Counter(json.dumps(c, ensure_ascii=False) for x in d for c in (x.get("categories") or []))
          print("::notice title=Kategorier::" + "; ".join(f"{k}={v}" for k, v in cats.most_common()))
          rail = [x for x in d if any(l.get("transport_mode") in ("METRO","TRAIN","TRAM","SHIP","FERRY") for l in lines(x))]
          rows = []
          for x in rail:
              mv = (x.get("message_variants") or [{}])[0]
              p = x.get("priority") or {}
              rows.append(f"{p.get('importance_level')}/{p.get('influence_level')}/{p.get('urgency_level')} {(x.get('publish') or {}).get('from','')[5:16]}→{(x.get('publish') or {}).get('upto','')[5:16]} "
                          f"[{','.join(l.get('transport_mode','')[:2]+l.get('designation','') for l in lines(x))[:40]}] "
                          f"{(mv.get('header') or '')[:70]} | cat={x.get('categories')} | grp={[l.get('group_of_lines') for l in lines(x)][:2]}")
          for i in range(0, len(rows), 6):
              print(f"::notice title=Spår {i}::" + " ||| ".join(rows[i:i+6]))
          bus = [x for x in d if any(l.get("transport_mode") == "BUS" for l in lines(x))]
          bh = collections.Counter(((x.get("message_variants") or [{}])[0].get("header") or "")[:40] for x in bus)
          print("::notice title=Buss rubriker::" + "; ".join(f"{k}={v}" for k, v in bh.most_common(15)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deviations
          path: deviations.json
          retention-days: 3
