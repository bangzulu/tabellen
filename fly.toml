# En liten maskin i Stockholm som alltid är igång, så att sidan svarar direkt
# (ca 2 USD/månad; Fly efterskänker fakturor under 5 USD).
# Vill du hellre att den somnar när ingen tittar: sätt min_machines_running = 0.
# Första besöket tar då några sekunder.
app = "tabellen"
primary_region = "arn"

[env]
  DATA_DIR = "/data"
  RT_CACHE_SECONDS = "30"
  RT_MONTHLY_BUDGET = "28000"

# Volym så att tidtabellen (60 MB) inte laddas ner igen vid varje omstart.
# Statiska nyckeln tillåter bara 65 nedladdningar per månad.
[mounts]
  source = "tabellen_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Reserv när tidtabellen byts ut en gång per dygn (gammal och ny ligger i minnet samtidigt).
swap_size_mb = 512
