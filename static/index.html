<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fordonspositioner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Laddas utan att blockera första visningen -->
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #f5f7f9;
    --surface: #ffffff;
    --ink: #14202b;
    --muted: #5d6b78;
    --rule: #dde3e8;
    --band: #eef2f5;
    --nav: #0c2340;
    --nav-ink: #ffffff;
    --late: #b26a00;
    --late-bg: #fdf1dc;
    --very-late: #b3261e;
    --very-late-bg: #fbe4e2;
    --ok: #2f6b3a;
    --focus: #3b82c4;
    --select-bg: #e3eefa;
    --select-edge: #1c4e80;
    --dot: #ffffff;
    --line: #1c4e80;            /* sätts per flik från JS */
    --land: #eef1f4; --land-edge: #c3ccd5; --water: #dbe7f1; --bus-ok: #6b7f93;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1820; --surface: #16212b; --ink: #e8eef3; --muted: #9aa8b5;
      --rule: #2a3946; --band: #1b2833; --nav: #0a2747; --nav-ink: #ffffff;
      --late: #f2b544; --late-bg: #3a2c10; --very-late: #ff8a80; --very-late-bg: #43201d;
      --ok: #8fd19e; --focus: #7cb8ee; --select-bg: #1d3550; --select-edge: #7cb8ee; --dot: #e8eef3;
      --land: #1b2833; --land-edge: #34485a; --water: #0d1820; --bus-ok: #8aa0b5;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 20px 16px 48px; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; margin-bottom: 16px; }
  h1 { font-size: 1.5rem; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .freshness { color: var(--muted); font-size: .95rem; }
  .freshness.stale { color: var(--very-late); font-weight: 600; }

  /* Menyn krymper med fönsterbredden så att alla flikar ryms på en rad från ca 1100 px
     (13-tums laptop); smalare än så bryts den på två rader, på mobil scrollar den i sidled. */
  nav { display: flex; flex-wrap: wrap; gap: 2px; background: var(--nav); border-radius: 6px 6px 0 0; padding: 4px; min-height: 48px; }
  nav button {
    flex: 0 0 auto; border: 0; background: transparent; color: var(--nav-ink); opacity: .8;
    font: inherit; font-weight: 600; font-size: clamp(.85rem, .5rem + .45vw, 1rem);
    padding: 10px clamp(8px, .8vw, 14px); border-radius: 4px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: clamp(5px, .4vw, 7px);
  }
  nav button:hover { opacity: 1; }
  nav button[aria-selected="true"] { background: var(--surface); color: var(--ink); opacity: 1; }
  nav .tick { flex: none; width: 4px; height: 1.15em; border-radius: 2px; background: var(--c); }

  /* Sammanfattning överst i fliken: i trafik enligt realtid mot tidtabell */
  .summary { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; padding: 12px;
             background: var(--surface); border: 1px solid var(--rule); border-top: 0; }
  .sum-stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0; }
  .sum-stats div { display: flex; flex-direction: column-reverse; }
  .sum-stats dt { color: var(--muted); font-size: .8rem; }
  .sum-stats dd { margin: 0; font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
  .sum-stats .short dd { color: var(--late); }
  /* Linjeväljare: gäller både tabell och linjevy */
  .sum-lines { display: flex; flex-wrap: wrap; gap: 6px; }
  .sum-lines button {
    display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 11px; border-radius: 4px; cursor: pointer;
    font: inherit; font-size: .9rem; color: var(--ink); background: var(--band); border: 1px solid transparent;
  }
  .sum-lines button:hover { border-color: var(--rule); }
  .sum-lines button[aria-pressed="true"] { background: var(--line); color: #fff; }
  .sum-lines strong { font-weight: 800; }
  .sum-lines .plan { opacity: .7; }
  .sum-lines .short .plan { color: var(--late); font-weight: 700; opacity: 1; }
  .sum-lines button[aria-pressed="true"].short .plan { color: #ffd38a; }
  @media (max-width: 720px) { nav { flex-wrap: nowrap; overflow-x: auto; } }
  nav .badge {
    min-width: 1.45em; height: 1.45em; padding: 0 4px; border-radius: 999px; font-size: .74em; font-weight: 800;
    display: inline-grid; place-items: center; background: var(--late-bg); color: var(--late);
  }

  /* Störningar */
  .alerts { background: var(--surface); border: 1px solid var(--rule); border-top: 0; padding: 12px; }
  .alerts:empty { display: none; }
  .alerts-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
  .alerts-head h2 { font-size: 1rem; font-weight: 800; margin: 0; }
  .alerts-head span { color: var(--muted); font-size: .85rem; }
  .calm { color: var(--muted); margin: 0 0 4px; }
  .alert-list { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 6px; }
  .alert { border-left: 4px solid var(--late); background: var(--late-bg); border-radius: 0 4px 4px 0; }
  .alert summary { cursor: pointer; padding: 8px 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; list-style: none; }
  .alert summary::-webkit-details-marker { display: none; }
  .alert summary::before { content: "▸"; color: var(--late); width: .8em; flex: none; }
  .alert details[open] summary::before { content: "▾"; }
  .alert strong { font-weight: 700; flex: 1 1 18em; }
  .alert .since { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .alert .body { padding: 0 12px 10px calc(10px + .8em + 10px); white-space: pre-line; max-width: 75ch; }
  .alert .body p { margin: 0 0 6px; }
  .alert .stops { color: var(--muted); font-size: .85rem; }
  .chips { display: inline-flex; gap: 4px; flex: none; }
  .chip { font-size: .8rem; font-weight: 800; padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; color: var(--ink); opacity: .85; }

  .trip-alerts { margin: 4px 0 8px; }
  .trip-alerts h3, .minor summary { font-size: .9rem; font-weight: 700; margin: 0 0 4px; }
  .trip-alerts ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .trip-alerts li { display: grid; grid-template-columns: 3.2em 5.5em 3.5em 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--rule); font-size: .95rem; }
  .trip-alerts li:last-child { border-bottom: 0; }
  .trip-alerts .line { font-weight: 800; }
  .trip-alerts .tnr, .trip-alerts .dep { color: var(--muted); }

  .minor { margin-top: 6px; }
  .minor summary { cursor: pointer; color: var(--muted); font-weight: 600; padding: 4px 0; }
  .minor ul { margin: 4px 0 0; padding-left: 1.2em; }
  .minor li { margin: 0 0 6px; }
  .minor li span { display: block; color: var(--muted); font-size: .85rem; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 10px 12px; background: var(--surface);
             border: 1px solid var(--rule); border-top: 0; font-size: .95rem; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .toolbar input { width: 18px; height: 18px; accent-color: var(--nav); }
  .toolbar .right { margin-left: auto; }

  /* Tabell + linjevy */
  .main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  .main.with-lv { grid-template-columns: 330px minmax(0, 1fr); }
  .main .lv { order: -1; }
  .board { background: var(--surface); border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 6px 6px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: .85rem; padding: 10px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  td.t, th.t { text-align: right; white-space: nowrap; }
  tr.dir td { background: var(--band); padding: 8px 12px; }
  tr.dir strong { font-weight: 800; margin-right: 10px; }
  tr.dir span { color: var(--muted); }
  tbody tr.veh { cursor: pointer; }
  tbody tr.veh:hover td { background: var(--band); }
  tbody tr.veh.selected td { background: var(--select-bg); }
  tbody tr.veh.selected td:first-child { box-shadow: inset 4px 0 0 var(--select-edge); }
  tr.cancelled td:not(.dev):not(.has-note) { color: var(--muted); text-decoration: line-through; }
  tr.cancelled td.has-note > .dest { color: var(--muted); text-decoration: line-through; }
  .line { font-weight: 800; }
  .sub { display: block; color: var(--muted); font-size: .85rem; }
  .note { display: block; color: var(--very-late); font-size: .85rem; max-width: 40ch; }
  .src { color: var(--muted); font-size: .8rem; margin-left: 4px; cursor: help; }

  .dev { width: 1%; }
  .pill { display: inline-block; min-width: 3.2em; text-align: center; font-weight: 800; padding: 3px 8px; border-radius: 4px; }
  .pill.zero { color: var(--muted); font-weight: 400; }
  .pill.early { color: var(--ok); }
  .pill.late { color: var(--late); background: var(--late-bg); }
  .pill.very-late, .pill.cancelled { color: var(--very-late); background: var(--very-late-bg); }
  .pill.unknown { color: var(--muted); font-weight: 400; }

  /* Linjevy (termometer) */
  .lv {
    position: sticky; top: 12px; margin-top: 12px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
  }
  .lv-head { display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px 8px; }
  .lv-badge { flex: none; min-width: 2.4em; padding: 3px 8px; border-radius: 4px; background: var(--line); color: #fff; font-weight: 800; text-align: center; }
  .lv-title { flex: 1; min-width: 0; }
  .lv-title strong { display: block; font-size: 1.05rem; font-weight: 800; line-height: 1.2; }
  .lv-title span { display: block; color: var(--muted); font-size: .85rem; }
  .lv-close { flex: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 1.4rem; line-height: 1; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
  .lv-close:hover { color: var(--ink); background: var(--band); }
  .lv-lines { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
  .lv-lines button {
    font: inherit; font-size: .85rem; font-weight: 700; padding: 3px 9px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  }
  .lv-lines button[aria-pressed="true"] { background: var(--line); border-color: var(--line); color: #fff; }
  .lv-lines button span { font-weight: 400; opacity: .75; margin-left: 4px; }
  .lv-sel { margin: 0 12px 8px; padding: 8px 10px; border-radius: 4px; background: var(--select-bg); box-shadow: inset 4px 0 0 var(--select-edge); font-size: .9rem; }
  .lv-sel .top { display: flex; align-items: center; gap: 8px; }
  .lv-sel .pill { min-width: 2.6em; padding: 1px 6px; }
  .lv-sel span.muted { color: var(--muted); }
  .lv-legend { display: flex; justify-content: space-between; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--rule); color: var(--muted); font-size: .8rem; font-weight: 600; }
  .lv-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 0 8px; }
  .lv-track { position: relative; }
  .lv-rail { position: absolute; left: 51px; width: 6px; background: var(--line); border-radius: 3px; }
  .lv-stn { position: absolute; left: 0; right: 0; height: 30px; display: flex; align-items: center; }
  .lv-stn::before {
    content: ""; position: absolute; left: 48px; top: 9px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--dot); border: 3px solid var(--line); box-sizing: border-box;
  }
  .lv-stn span { margin-left: 112px; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
  .lv-stn.end span { font-weight: 800; }
  .lv-veh {
    position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; padding: 0; border-radius: 50%;
    border: 2px solid var(--surface); background: var(--line); color: #fff; font-size: 10px; line-height: 1;
    display: grid; place-items: center; cursor: pointer; z-index: 1;
    transition: top 1.2s linear, transform .15s;
  }
  .lv-veh.late { box-shadow: 0 0 0 3px var(--late); }
  .lv-veh.very-late { box-shadow: 0 0 0 3px var(--very-late); }
  .lv-veh:hover { transform: scale(1.15); z-index: 3; }
  .lv-veh.selected { transform: scale(1.35); z-index: 4; box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--select-edge); }
  .lt { position: relative; }
  .lt svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .lt-path { fill: none; stroke: var(--line); stroke-width: 5; stroke-linecap: round; }
  .lt-stn { fill: var(--dot); stroke: var(--line); stroke-width: 2.5; }
  .lt-stn.end { stroke-width: 3; }
  .lt-lbl { position: absolute; transform: translateY(-50%); font-size: .82rem; line-height: 1.2;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lt-lbl.left { text-align: right; }
  .lt-lbl.end { font-weight: 800; }
  .lt-lbl .ln { display: inline-block; font-size: .68rem; font-weight: 800; padding: 0 4px; margin: 0 0 0 4px; border-radius: 3px;
                background: var(--line); color: #fff; vertical-align: 1px; }
  .lt-lbl.left .ln { margin: 0 4px 0 0; }
  /* Linjeträdet: små pilar i linjens färg; orange/röd vid försening */
  .lv-veh.small {
    width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 0; border-radius: 50%; background: transparent;
    color: var(--arrow, var(--line)); box-shadow: none; transition: top 1.2s linear, left 1.2s linear, transform .15s;
  }
  .lv-veh.small svg { width: 13px; height: 12px; overflow: visible; }
  .lv-veh.small path { fill: currentColor; stroke: var(--surface); stroke-width: 1.4; paint-order: stroke; stroke-linejoin: round; }
  .lv-veh.small.late { color: var(--late); box-shadow: none; }
  .lv-veh.small.very-late { color: var(--very-late); box-shadow: none; }
  .lv-veh.small:hover { transform: scale(1.3); }
  .lv-veh.small.selected { transform: scale(1.6); box-shadow: none; outline: 2px solid var(--select-edge); outline-offset: 0; }
  .lv-foot { margin: 0; padding: 8px 12px; border-top: 1px solid var(--rule); color: var(--muted); font-size: .8rem; }
  .lv-empty { padding: 16px 12px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .lv-veh, .lv-veh.small { transition: none; } }

  .message { padding: 32px 16px; text-align: center; color: var(--muted); }
  .message.error { color: var(--very-late); }
  footer { margin-top: 14px; color: var(--muted); font-size: .85rem; }

  /* Växel Tabell/Linjevy, bara på smala skärmar */
  .viewswitch { display: none; }
  /* ---------- Bussöversikt ---------- */
  .bv { background: var(--surface); border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 6px 6px; padding: 12px; }
  .bv-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; margin-bottom: 12px; }
  .bv-updated { color: var(--muted); font-size: .85rem; }
  .bv-brief { border-left: 4px solid var(--nav); background: var(--band); border-radius: 0 4px 4px 0; padding: 10px 14px; margin-bottom: 14px; max-width: 95ch; }
  .bv-brief-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .bv-brief h2, .bv-hotspots h2 { font-size: 1rem; font-weight: 800; margin: 0; }
  .bv-brief p { margin: 0 0 4px; }
  .bv-copy, .bv-more, .bv-seg button {
    font: inherit; font-size: .85rem; font-weight: 700; padding: 4px 10px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  }
  .bv-seg { display: inline-flex; gap: 4px; }
  .bv-seg button[aria-pressed="true"] { background: var(--nav); border-color: var(--nav); color: #fff; }
  .bv-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
  .bv-map { position: sticky; top: 12px; }
  .bv-map-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; margin-bottom: 6px; }
  .bv-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: .8rem; }
  .bv-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .bv-legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .bv-legend .dot.ok { background: var(--bus-ok); } .bv-legend .dot.late { background: var(--late); } .bv-legend .dot.very { background: var(--very-late); }
  .bv-legend .ring { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--very-late); display: inline-block; }
  .bv-svg { width: 100%; height: auto; display: block; background: var(--water); border-radius: 6px; border: 1px solid var(--rule); }
  .bv-area { fill: var(--land); stroke: var(--land-edge); stroke-width: .8; cursor: pointer; }
  .bv-area:hover { stroke: var(--ink); stroke-width: 1.4; }
  .bv-area.minor { fill: var(--late-bg); stroke: var(--late); }
  .bv-area.major { fill: var(--very-late-bg); stroke: var(--very-late); }
  .bv-bus { stroke: none; pointer-events: none; }
  .bv-bus.ok { fill: var(--bus-ok); } .bv-bus.late { fill: var(--late); } .bv-bus.very { fill: var(--very-late); }
  .bv-hot { fill: none; stroke: var(--very-late); stroke-width: 2.2; }
  .bv-label { font-size: 11px; font-weight: 700; fill: var(--muted); paint-order: stroke; stroke: var(--land); stroke-width: 3px; cursor: pointer; }
  .bv-label.minor { fill: var(--late); font-size: 12.5px; }
  .bv-label.major { fill: var(--very-late); font-size: 13.5px; font-weight: 800; }
  .bv-areas { overflow-x: auto; }
  .bv-areas table { width: 100%; border-collapse: collapse; }
  .bv-areas th { font-size: .8rem; }
  .bv-areas td { padding: 8px 8px; }
  .bv-row { cursor: pointer; }
  .bv-row:hover td { background: var(--band); }
  .bv-row.open td { background: var(--select-bg); }
  .bv-name { font: inherit; font-weight: 700; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .bv-pill { display: inline-block; font-size: .75rem; font-weight: 800; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
  .bv-pill.major { background: var(--very-late-bg); color: var(--very-late); }
  .bv-pill.minor { background: var(--late-bg); color: var(--late); }
  .bv-pill.normal { color: var(--muted); }
  .bv-sparkcell { display: inline-flex; align-items: center; gap: 6px; }
  .bv-spark path { fill: none; stroke: var(--ink); stroke-width: 1.6; }
  .bv-spark .ref { stroke: var(--late); stroke-dasharray: 2 2; stroke-width: 1; }
  .bv-trend { font-size: .8rem; font-weight: 800; }
  .bv-trend.up { color: var(--very-late); } .bv-trend.down { color: var(--ok); }
  .bv-detail td { background: var(--select-bg); padding: 4px 12px 14px; border-bottom: 2px solid var(--rule); }
  .bv-facts { margin: 6px 0; font-size: .92rem; }
  .bv-facts .warn { color: var(--late); }
  .bv-lines { width: auto; min-width: 60%; margin: 6px 0 8px; font-size: .9rem; background: var(--surface); border-radius: 4px; }
  .bv-lines th, .bv-lines td { padding: 4px 10px; }
  .bv-sub h4 { margin: 8px 0 2px; font-size: .88rem; }
  .bv-sub ul, .bv-planned ul { margin: 0; padding-left: 1.2em; font-size: .9rem; }
  .bv-sub li { margin-bottom: 3px; }
  .bv-planned summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: .88rem; margin-top: 8px; }
  .bv-more { margin: 10px 0 0; }
  .bv-calm { color: var(--muted); }
  .bv-hotspots { margin-top: 16px; }
  .bv-hotspots ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .bv-hotspots li { border: 1px solid var(--rule); border-left: 4px solid var(--very-late); border-radius: 0 4px 4px 0; padding: 8px 10px; cursor: pointer; }
  .bv-hotspots li:hover { background: var(--band); }
  .muted { color: var(--muted); }
  @media (max-width: 1080px) {
    .bv-grid { grid-template-columns: minmax(0, 1fr); }
    .bv-map { position: static; }
    .toolbar .right { display: none; }
    .viewswitch { display: flex; width: 100%; padding: 3px; gap: 3px; border-radius: 6px; background: var(--band); }
    .viewswitch button {
      flex: 1; border: 0; border-radius: 4px; padding: 8px 10px; background: transparent; color: var(--muted);
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .viewswitch button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
    .toolbar.lv-mode .table-only { display: none; }
    .lv { position: static; margin-top: 0; max-height: none; border-top: 0; border-radius: 0 0 6px 6px; }
    .lv-scroll { overflow: visible; }
    .lv-close { display: none; }
  }
  .lv-sel .goto { margin-top: 6px; font: inherit; font-size: .85rem; font-weight: 700; padding: 4px 10px; border-radius: 4px;
                  border: 1px solid var(--select-edge); background: transparent; color: var(--select-edge); cursor: pointer; }
  @media (max-width: 720px) {
    .hide-sm { display: none; }
    td, th { padding: 8px; }
    .trip-alerts li { grid-template-columns: 2.6em 3.5em 1fr; }
    .trip-alerts .tnr { display: none; }
    .alert .body { padding-left: 12px; }
    .toolbar .right { margin-left: 0; }
    .sum-stats { gap: 8px 18px; }
    .sum-stats dd { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Senast passerade stationer</h1>
    <div class="freshness" id="freshness" aria-live="polite">Hämtar…</div>
  </header>

  <nav id="tabs" role="tablist" aria-label="Trafikslag"></nav>
  <div id="panel" role="tabpanel">
    <section class="summary" id="summary" aria-label="Antal i trafik"></section>
    <section class="alerts" id="alerts" aria-label="Störningar"></section>
    <div class="toolbar" id="toolbar">
      <div class="viewswitch" role="group" aria-label="Visa">
        <button type="button" data-view="table" aria-pressed="true">Tabell</button>
        <button type="button" data-view="lv" aria-pressed="false">Linjevy</button>
      </div>
      <label class="table-only"><input type="checkbox" id="onlyDeviations"> Visa bara avvikelser (±2 min, inställda eller med störning)</label>
      <label class="table-only"><input type="checkbox" id="sortByDelay"> Störst försening först</label>
      <label class="right"><input type="checkbox" id="showLv"> Linjevy</label>
    </div>
    <section class="bv" id="bus" aria-label="Bussar: läget per område" hidden></section>
    <div class="main" id="main">
      <div class="board" id="board"><div class="message">Hämtar…</div></div>
      <aside class="lv" id="lv" aria-label="Linjevy" hidden></aside>
    </div>
  </div>
  <footer>Data från Trafiklab (GTFS Regional, SL), tabell och störningar. Avvikelse i minuter: + betyder sen.
    Klicka på en avgång för att se den i linjevyn, eller på ett tåg i linjevyn för att hitta det i tabellen.</footer>
</div>

<script src="/static/tree.js"></script>
<script src="/static/bus.js"></script>
<script>
const REFRESH_MS = 15000;
const CACHE_KEY = "tabellen:last";
const LV_KEY = "tabellen:linjevy";
const VIEW_KEY = "tabellen:vy";                   // smala skärmar: "table" eller "lv"
const NARROW = matchMedia("(max-width: 1080px)");
const CACHE_MAX_AGE_S = 600;
const ROW = 30;                                   // px per station i linjevyn
const LANE = { up: 25, down: 82 };                // x-mitt för tåg uppåt / nedåt
const TZ = "Europe/Stockholm";
const fmt = new Intl.DateTimeFormat("sv-SE", { hour: "2-digit", minute: "2-digit", timeZone: TZ });
const fmtSec = new Intl.DateTimeFormat("sv-SE", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: TZ });
const fmtDay = new Intl.DateTimeFormat("sv-SE", { day: "numeric", month: "short", timeZone: TZ });
const fmtYmd = new Intl.DateTimeFormat("sv-SE", { year: "numeric", month: "2-digit", day: "2-digit", timeZone: TZ });
const TAB_NAMES = { PT: "Pendeltåg", RB: "Roslagsbanan", TVB: "Tvärbanan", SB: "Saltsjöbanan", LB: "Lidingöbanan",
                    SpvC: "Linje 7", TB1: "Gröna linjen", TB2: "Röda linjen", TB3: "Blå linjen", BUS: "Buss" };
const TAB_COLOR = { PT: "#c8327a", RB: "#7d4a9e", TVB: "#c26a12", SB: "#12858c", LB: "#7a5b4e",
                    SpvC: "#66707a", TB1: "#2c8a40", TB2: "#cc2f27", TB3: "#1f6fb2", BUS: "#9fb4c8" };
const SRC = {
  "tripupdate": ["", ""],
  "tripupdate-inferred": ["≈", "Härledd: flödet saknar passerade hållplatser"],
  "vehicleposition": ["◦", "Från fordonsposition (GPS)"],
  "schedule": ["", ""],
};

let current = null, timer = null, last = null, loading = false, lastError = null;
let selected = null;                 // trip_id för vald avgång
const lvLine = new Map();            // vald linje (eller ALL) per flik, gemensam för tabell och linjevy
const openAlerts = new Set();        // vilka störningar som är utfällda, överlever omritning
const $ = (id) => document.getElementById(id);
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const c of children) if (c != null && c !== false) n.append(c);
  return n;
}
const time = (s) => (s ? fmt.format(new Date(s * 1000)) : "–");
const ymd = (d) => fmtYmd.format(d);
function since(s) {
  if (!s) return "";
  const d = new Date(s * 1000);
  return "sedan " + (ymd(d) === ymd(new Date()) ? fmt.format(d) : fmtDay.format(d));
}
function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

function readCache() {
  try {
    const c = JSON.parse(recall(CACHE_KEY) || "null");
    if (c && c.tabs && Date.now() / 1000 - c.generated_at < CACHE_MAX_AGE_S) return c;
  } catch (e) {}
  return null;
}

function delayClass(row) {
  if (row.status === "cancelled") return "cancelled";
  const d = row.delay_min;
  if (d == null) return "unknown";
  return d >= 10 ? "very-late" : d >= 3 ? "late" : d <= -1 ? "early" : "zero";
}
function pill(row) {
  if (row.status === "cancelled") return el("span", { class: "pill cancelled", text: "Inställd" });
  const d = row.delay_min;
  if (d == null) return el("span", { class: "pill unknown", text: "?", title: "Ingen avvikelse i datat" });
  return el("span", { class: "pill " + delayClass(row), text: d > 0 ? "+" + d : String(d) });
}

/* ---------- Flikar ---------- */

function renderTabs() {
  const codes = last ? [...Object.keys(last.tabs), "BUS"] : Object.keys(TAB_NAMES);
  $("tabs").replaceChildren(...codes.map((code) => {
    const t = last?.tabs[code];
    const b = el("button", { role: "tab", "aria-selected": String(code === current), id: "tab-" + code,
                             "aria-controls": "panel", tabindex: code === current ? "0" : "-1" },
      el("span", { class: "tick", style: `--c:${TAB_COLOR[code]}`, "aria-hidden": "true" }), TAB_NAMES[code] || code);
    if (code === "BUS" && last?.bus_issues) b.append(el("span", { class: "badge", text: last.bus_issues,
      title: last.bus_issues + " områden med förseningar", "aria-label": last.bus_issues + " områden med förseningar" }));
    if (t?.alerts.count) b.append(el("span", { class: "badge", text: t.alerts.count,
                                               title: t.alerts.count + " störningar", "aria-label": t.alerts.count + " störningar" }));
    b.addEventListener("click", () => select(code));
    return b;
  }));
}

/* Klart färre tåg ute än planerat: minst 2 och 15 %. */
const isShort = (real, planned) => planned - real >= 2 && (planned - real) / planned >= 0.15;

/* Sammanfattning: i trafik enligt realtid mot tidtabell, totalt och per linje. */
function renderSummary(tab) {
  const counts = new Map();
  for (const r of tabRows(tab)) if (r.status !== "cancelled") { const b = baseLineOf(tab, r.line); counts.set(b, (counts.get(b) || 0) + 1); }
  const stat = (label, value, cls = "") => el("div", { class: cls }, el("dt", { text: label }), el("dd", { text: value }));
  $("summary").replaceChildren(...[
    el("dl", { class: "sum-stats" },
      stat("i trafik", tab.count, isShort(tab.count, tab.planned) ? "short" : ""),
      stat("enligt tidtabell", tab.planned)),
    tab.lines.length > 1 ? lineSelector(tab, counts) : null,
  ].filter(Boolean));
}

/* Linjeväljare: Alla eller en linje. Styr både tabellen och linjevyn. */
function lineSelector(tab, counts) {
  const sel = lvSelection(tab);
  const btn = (value, label, real, planned) => {
    const b = el("button", { type: "button", "aria-pressed": String(sel === value), class: isShort(real, planned) ? "short" : "",
                             title: `${value === ALL ? "Alla linjer" : "Linje " + value}: ${real} i trafik, ${planned} enligt tidtabell` },
      el("strong", { text: label }), el("span", { text: real }), el("span", { class: "plan", text: `(${planned})` }));
    b.addEventListener("click", () => setLine(value));
    return b;
  };
  return el("div", { class: "sum-lines", role: "group", "aria-label": "Välj linje" },
    btn(ALL, "Alla", tab.count, tab.planned),
    ...tab.lines.map((l) => btn(l.line, l.line, counts.get(l.line) || 0, l.planned)));
}

function setLine(value) {
  lvLine.set(current, value);
  const tab = last?.tabs[current];
  const r = selected && tab ? tabRows(tab).find((x) => x.trip_id === selected) : null;
  if (r && value !== ALL && baseLineOf(tab, r.line) !== value) selected = null;   // valt tåg finns inte längre i urvalet
  render();
  centerSelectedMarker("auto");
}

/* ---------- Störningar ---------- */

function chips(lines) {
  return lines.length ? el("span", { class: "chips" }, ...lines.map((l) => el("span", { class: "chip", text: l }))) : null;
}

function alertItem(a) {
  const d = el("details", {},
    el("summary", {}, chips(a.lines), el("strong", { text: a.title }), el("span", { class: "since", text: since(a.since) })),
    el("div", { class: "body" },
      a.text ? el("p", { text: a.text }) : null,
      a.stops.length ? el("p", { class: "stops", text: "Hållplatser: " + a.stops.join(", ") }) : null));
  if (openAlerts.has(a.id)) d.open = true;
  d.addEventListener("toggle", () => (d.open ? openAlerts.add(a.id) : openAlerts.delete(a.id)));
  return el("li", { class: "alert" }, d);
}

function minorSection(key, label, items) {
  if (!items.length) return null;
  const d = el("details", { class: "minor" }, el("summary", { text: `${label} (${items.length})` }),
    el("ul", {}, ...items.map((a) => el("li", {}, a.title, a.text ? el("span", { text: a.text.split("\n")[0] }) : null))));
  if (openAlerts.has(key)) d.open = true;
  d.addEventListener("toggle", () => (d.open ? openAlerts.add(key) : openAlerts.delete(key)));
  return d;
}

function renderAlerts(tab) {
  const a = tab.alerts;
  const box = $("alerts");
  if (last.alerts_timestamp == null) {
    box.replaceChildren(el("p", { class: "calm", text: "Störningsinformationen kunde inte hämtas just nu." }));
    return;
  }
  box.replaceChildren(...[
    el("div", { class: "alerts-head" }, el("h2", { text: "Störningar" }), el("span", { text: "uppdaterad " + time(last.alerts_timestamp) })),
    !a.traffic.length && !a.trips.length ? el("p", { class: "calm", text: "Inga kända trafikstörningar." }) : null,
    a.traffic.length ? el("ul", { class: "alert-list" }, ...a.traffic.map(alertItem)) : null,
    a.trips.length ? el("div", { class: "trip-alerts" },
      el("h3", { text: "Enskilda avgångar" }),
      el("ul", {}, ...a.trips.map((t) => el("li", {},
        el("span", { class: "line", text: t.line }),
        el("span", { class: "tnr", text: "tåg " + t.train_number }),
        el("span", { class: "dep", text: time(t.departs), title: "Avgång från första hållplatsen" }),
        el("span", { text: `${t.destination}: ${t.text}` }))))) : null,
    minorSection("access", "Hissar och entréer", a.access),
    minorSection("info", "Skyltar och övrigt", a.info),
  ].filter(Boolean));
}

/* ---------- Tabell ---------- */

function topDestinations(rows) {
  const c = new Map();
  for (const r of rows) c.set(r.destination, (c.get(r.destination) || 0) + 1);
  return [...c.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([d]) => d);
}

function renderBoard(tab) {
  const onlyDev = $("onlyDeviations").checked, byDelay = $("sortByDelay").checked;
  const thead = el("thead", {}, el("tr", {},
    el("th", { class: "dev", text: "Avvikelse" }), el("th", { text: "Linje" }), el("th", { text: "Destination" }),
    el("th", { text: "Senast passerad" }), el("th", { class: "t", text: "Passerade" }),
    el("th", { class: "t hide-sm", text: "Ordinarie" }), el("th", { class: "hide-sm", text: "Nästa" }),
    el("th", { class: "t", text: "Tågnr" })));
  const tbody = el("tbody");
  let shown = 0;
  const sel = lvSelection(tab);
  const inSel = (r) => !sel || sel === ALL || baseLineOf(tab, r.line) === sel;

  for (const g of tab.groups) {
    let rows = g.rows.filter(inSel);
    const dests = sel && sel !== ALL ? topDestinations(rows) : g.destinations;
    if (onlyDev) rows = rows.filter((r) => r.status === "cancelled" || r.notes?.length || (r.delay_min != null && Math.abs(r.delay_min) >= 2));
    if (byDelay) rows = [...rows].sort((a, b) => (b.status === "cancelled") - (a.status === "cancelled") || (b.delay_min ?? -99) - (a.delay_min ?? -99));
    if (!rows.length) continue;
    tbody.append(el("tr", { class: "dir" }, el("td", { colspan: "8" },
      el("strong", { text: g.label }), el("span", { text: dests.length ? "mot " + dests.join(", ") : "" }))));
    for (const r of rows) {
      shown++;
      const [mark, hint] = SRC[r.observed_source] || ["", ""];
      const obs = el("td", {}, r.observed_stop);
      if (mark) obs.append(el("span", { class: "src", title: hint, "aria-label": hint, text: mark }));
      if (r.status === "terminus") obs.append(el("span", { class: "sub", text: "Vid ändhållplats" }));
      const dest = el("td", { class: r.notes?.length ? "has-note" : "" }, el("span", { class: "dest", text: r.destination }),
        ...(r.notes || []).map((n) => el("span", { class: "note", text: n })));
      const tr = el("tr", { class: "veh " + r.status, "data-trip": r.trip_id, tabindex: "0" },
        el("td", { class: "dev" }, pill(r)),
        el("td", { class: "line", text: r.line }),
        dest,
        obs,
        el("td", { class: "t", text: time(r.passed_at) }),
        el("td", { class: "t hide-sm", text: time(r.scheduled_at) }),
        el("td", { class: "hide-sm" }, r.next_stop || "–",
           r.next_expected_at ? el("span", { class: "sub", text: "förväntas " + time(r.next_expected_at) }) : null),
        el("td", { class: "t", text: r.train_number }));
      tbody.append(tr);
    }
  }
  $("board").replaceChildren(shown ? el("table", {}, thead, tbody)
    : el("div", { class: "message", text: onlyDev ? "Inga avvikelser just nu." : "Inga fordon i trafik för det här trafikslaget." }));
}

/* ---------- Linjevy ---------- */

function tabRows(tab) { return tab.groups.flatMap((g) => g.rows); }

function baseLineOf(tab, line) {
  return tab.lines.find((l) => l.variants.includes(line))?.line ?? line;
}

function patternIndex(pat) {
  if (!pat._index) {
    pat._index = new Map();
    pat.stations.forEach((s, i) => { if (!pat._index.has(s)) pat._index.set(s, i); });
  }
  return pat._index;
}

/* Var på linjen ett tåg är: position i "stationsenheter" (0 = översta stationen) och riktning. */
function place(pat, r, now) {
  if (r.status === "cancelled") return null;
  const idx = patternIndex(pat);
  const i = idx.get(r.observed_stop);
  if (i == null) return null;
  const j = r.next_stop ? idx.get(r.next_stop) : null;
  let dir;
  if (j != null && j !== i) dir = j > i ? "down" : "up";
  else dir = r.direction_id === pat.down_direction_id ? "down" : "up";
  let pos = i;
  if (j != null && j !== i && r.status === "running") {
    let f = 0;
    if (r.passed_at && r.next_expected_at && r.next_expected_at > r.passed_at) {
      f = (now - r.passed_at) / (r.next_expected_at - r.passed_at);
    }
    pos = i + (j - i) * Math.max(0, Math.min(0.9, f));   // aldrig framme innan datat säger det
  }
  return { pos, dir };
}

const ALL = "*";   // linjevyns läge "alla linjer" (linjeträd)

/* Vald linje i linjevyn, eller ALL. Standard är trädet när fliken har flera linjer. */
function lvSelection(tab) {
  if (!tab.lines.length) return null;
  if (tab.lines.length === 1) return tab.lines[0].line;
  const v = lvLine.get(current);
  return v === ALL || tab.lines.some((l) => l.line === v) ? v : ALL;
}

function currentPattern(tab) {
  const v = lvSelection(tab);
  return v && v !== ALL ? tab.lines.find((l) => l.line === v) : null;
}

const treeCache = new Map();
function treeFor(tab) {
  const key = current + ":" + tab.lines.map((l) => l.line + "/" + l.stations.join(",")).join(";");
  if (!treeCache.has(key)) treeCache.set(key, window.LineTree.buildTree(tab.lines));
  return treeCache.get(key);
}

function vehLabel(r) {
  const d = r.delay_min == null ? "" : r.delay_min > 0 ? `, ${r.delay_min} min sen` : r.delay_min < 0 ? `, ${-r.delay_min} min tidig` : ", i tid";
  const where = r.next_stop && r.status === "running" ? `mellan ${r.observed_stop} och ${r.next_stop}` : `vid ${r.observed_stop}`;
  return `Tåg ${r.train_number}, linje ${r.line} mot ${r.destination}, ${where}${d}`;
}

let narrowView = null;   // sätts vid start

/* Breda skärmar: linjevy bredvid tabellen (kan stängas). Smala: växla mellan tabell och linjevy. */
function lvVisible() { return NARROW.matches ? narrowView === "lv" : $("showLv").checked; }
function applyLayout() {
  const narrow = NARROW.matches, show = lvVisible();
  $("lv").hidden = !show;
  $("main").classList.toggle("with-lv", show && !narrow);
  $("board").hidden = narrow && narrowView === "lv";
  $("toolbar").classList.toggle("lv-mode", narrow && narrowView === "lv");
  for (const b of document.querySelectorAll(".viewswitch button")) b.setAttribute("aria-pressed", String(b.dataset.view === narrowView));
}
function setView(view) {
  narrowView = view;
  store(VIEW_KEY, view);
  renderLv();
  const behavior = "auto";
  if (view === "lv") centerSelectedMarker(behavior);
  else if (selected) document.querySelector(`tr.veh[data-trip="${CSS.escape(selected)}"]`)?.scrollIntoView({ block: "center", behavior });
}
function centerSelectedMarker(behavior) {
  const btn = selected && document.querySelector(`.lv-veh[data-trip="${CSS.escape(selected)}"]`);
  if (!btn) return;
  if (NARROW.matches) { btn.scrollIntoView({ block: "center", behavior }); return; }
  const sc = $("lv-scroll");
  if (sc) sc.scrollTo({ top: parseFloat(btn.style.top) - sc.clientHeight / 2, behavior });
}

let lvGeom = null;   // hur tåg placeras i den vy som visas (för tickPositions)

function lineCounts(tab) {
  const counts = new Map();
  for (const r of tabRows(tab)) if (r.status !== "cancelled") { const b = baseLineOf(tab, r.line); counts.set(b, (counts.get(b) || 0) + 1); }
  return counts;
}

function renderLv() {
  const box = $("lv");
  applyLayout();
  lvGeom = null;
  if (!lvVisible() || !last) return;
  const tab = last.tabs[current];
  const sel = lvSelection(tab);
  const close = el("button", { class: "lv-close", "aria-label": "Stäng linjevyn", title: "Stäng linjevyn", text: "×" });
  close.addEventListener("click", () => setLv(false));
  if (!sel) {
    box.replaceChildren(el("div", { class: "lv-head" }, el("div", { class: "lv-title" }, el("strong", { text: TAB_NAMES[current] })), close),
      el("p", { class: "lv-empty", text: "Ingen linjeinformation för det här trafikslaget." }));
    return;
  }
  const body = sel === ALL ? treeBody(tab) : lineBody(tab, tab.lines.find((l) => l.line === sel));

  const selRow = selected && tabRows(tab).find((r) => r.trip_id === selected);
  const selCard = selRow ? el("div", { class: "lv-sel", "aria-live": "polite" },
    el("div", { class: "top" }, pill(selRow), el("strong", { text: `${selRow.line} ${selRow.destination}` }), el("span", { class: "muted", text: "tåg " + selRow.train_number })),
    el("span", { class: "muted", text: selRow.status === "running" && selRow.next_stop
      ? `${selRow.observed_stop} → ${selRow.next_stop}${selRow.next_expected_at ? ", förväntas " + time(selRow.next_expected_at) : ""}`
      : selRow.status === "terminus" ? `Vid ändhållplats ${selRow.observed_stop}` : selRow.observed_stop }),
    body.outside.includes(selRow) ? el("span", { class: "muted", text: " (kan inte placeras i linjevyn)" }) : null,
    NARROW.matches ? el("div", {}, gotoTable()) : null) : null;

  box.replaceChildren(...[
    el("div", { class: "lv-head" }, ...body.head, close),
    selCard,
    el("div", { class: "lv-legend" }, ...body.legend.map((t) => el("span", { text: t }))),
    el("div", { class: "lv-scroll", id: "lv-scroll" }, body.track),
    body.outside.length ? el("p", { class: "lv-foot", text: `${body.outside.length} tåg kunde inte placeras (station utanför linjekartan).` }) : null,
  ].filter(Boolean));
}

function arrowSvg(dir) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 12 11");
  svg.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", dir === "up" ? "M6 0.5L11.5 10.5H0.5Z" : "M6 10.5L11.5 0.5H0.5Z");
  svg.append(p);
  return svg;
}

function vehButton(r, x, y, dir, small) {
  const btn = el("button", {
    class: "lv-veh " + dir + " " + delayClass(r) + (small ? " small" : "") + (r.trip_id === selected ? " selected" : ""),
    "data-trip": r.trip_id, style: `top:${y}px;left:${x}px`, "aria-label": vehLabel(r), title: vehLabel(r),
    "aria-pressed": String(r.trip_id === selected),
  }, small ? arrowSvg(dir) : dir === "up" ? "▲" : "▼");
  btn.addEventListener("click", () => selectTrip(r.trip_id, "lv"));
  return btn;
}

/* En linje: stationer i en lodrät lista, tåg i körfält till vänster (uppåt) och höger (nedåt). */
function lineBody(tab, pat) {
  const now = Date.now() / 1000;
  const rows = tabRows(tab).filter((r) => baseLineOf(tab, r.line) === pat.line);
  const placed = [], outside = [];
  for (const r of rows) { const p = place(pat, r, now); if (p) placed.push([r, p]); else if (r.status !== "cancelled") outside.push(r); }
  const n = pat.stations.length;
  const track = el("div", { class: "lv-track", style: `height:${n * ROW}px` },
    el("div", { class: "lv-rail", style: `top:${ROW / 2}px;height:${(n - 1) * ROW}px` }),
    ...pat.stations.map((s, i) => el("div", { class: "lv-stn" + (i === 0 || i === n - 1 ? " end" : ""), style: `top:${i * ROW}px` },
      el("span", { text: s, title: s }))));
  const lastY = { up: [], down: [] };
  for (const [r, p] of placed.sort((a, b) => a[1].pos - b[1].pos)) {
    const y = p.pos * ROW + ROW / 2;
    const crowd = lastY[p.dir].filter((v) => Math.abs(v - y) < 20).length;
    lastY[p.dir].push(y);
    track.append(vehButton(r, LANE[p.dir] + (p.dir === "up" ? -1 : 1) * Math.min(crowd, 2) * 7, y, p.dir, false));
  }
  lvGeom = { kind: "line", pat };
  const real = rows.filter((r) => r.status !== "cancelled").length;
  return {
    head: [el("span", { class: "lv-badge", text: pat.line }),
      el("div", { class: "lv-title" }, el("strong", { text: TAB_NAMES[current] }),
        el("span", { text: `${pat.stations[0]} – ${pat.stations[n - 1]} · ${n} stationer · ${real} i trafik (${pat.planned} enligt tidtabell)` }))],
    legend: ["▲ mot " + pat.stations[0], "▼ mot " + pat.stations[n - 1]],
    track, outside,
  };
}

/* Alla linjer: schematisk karta med förgreningar (se tree.js). Namn som inte får plats
   utelämnas men finns som verktygstips. */
const TREE = { row: 24, col: 30, gap: 20, pad: 10 };
let measureCtx = null;
function textWidth(text, bold) {
  measureCtx ||= document.createElement("canvas").getContext("2d");
  const fam = getComputedStyle(document.body).fontFamily;
  measureCtx.font = `${bold ? 800 : 400} 13px ${fam}`;
  return measureCtx.measureText(text).width;
}
const chipLines = (tree, n) => (n.ends.size === 1 && tree.lineCount > 1 ? [...n.ends] : []);   // linjenummer vid ändstation
function labelWidth(tree, n) { return textWidth(n.name, n.ends.size > 0) + chipLines(tree, n).length * 26 + 2; }

/* Vänstermarginalen anpassas efter de namn som står till vänster, men lämnar plats åt höger. */
function treeGeom(tree, width) {
  const nodes = [...tree.nodes.values()];
  const leftNeed = Math.max(0, ...nodes.filter((n) => n.label === "left").map((n) => labelWidth(tree, n)));
  const colsW = (tree.cols - 1) * TREE.col;
  const left = leftNeed ? Math.min(leftNeed + TREE.gap, Math.max(70, (width - colsW) * 0.52)) : 0;
  const x0 = left + TREE.pad;
  return { X: (c) => x0 + c * TREE.col, Y: (r) => r * TREE.row + TREE.row / 2 + 4 };
}

function treePlace(tree, g, tab, r, now) {
  if (r.status === "cancelled") return null;
  const a = tree.nodes.get(r.observed_stop);
  if (!a) return null;
  const b = r.next_stop ? tree.nodes.get(r.next_stop) : null;
  let dir;
  if (b && b !== a) dir = g.Y(b.row) > g.Y(a.row) ? "down" : "up";
  else {
    const pat = tab.lines.find((l) => l.line === baseLineOf(tab, r.line));
    dir = pat && r.direction_id === pat.down_direction_id ? "down" : "up";
  }
  let pt = { x: g.X(a.col), y: g.Y(a.row) };
  if (b && b !== a && r.status === "running") {
    let f = 0;
    if (r.passed_at && r.next_expected_at && r.next_expected_at > r.passed_at) f = (now - r.passed_at) / (r.next_expected_at - r.passed_at);
    pt = window.LineTree.pointOnEdge(a, b, Math.max(0, Math.min(0.9, f)), g.X, g.Y);
  }
  return { x: pt.x + (dir === "up" ? -9 : 9), y: pt.y, dir };
}

function treeBody(tab) {
  const tree = treeFor(tab);
  const g = treeGeom(tree, ($("lv").clientWidth || 330) - 8);
  const h = tree.rows * TREE.row + 8;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("aria-hidden", "true");
  for (const e of tree.edges) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", window.LineTree.edgePath(e.a, e.b, g.X, g.Y));
    p.setAttribute("class", "lt-path");
    svg.append(p);
  }
  const labels = [];
  for (const n of tree.nodes.values()) {
    const c = document.createElementNS(NS, "circle");
    const isEnd = n.ends.size > 0;
    c.setAttribute("cx", g.X(n.col)); c.setAttribute("cy", g.Y(n.row)); c.setAttribute("r", isEnd ? 5.5 : 4.5);
    c.setAttribute("class", "lt-stn" + (isEnd ? " end" : ""));
    const t = document.createElementNS(NS, "title"); t.textContent = n.name; c.append(t);
    svg.append(c);
    if (!n.label) continue;
    const x = g.X(n.col), y = g.Y(n.row);
    const style = n.label === "right" ? `top:${y}px;left:${x + TREE.gap}px;right:6px` : `top:${y}px;left:4px;width:${x - TREE.gap - 4}px`;
    const chips = chipLines(tree, n).map((l) => el("span", { class: "ln", text: l }));
    labels.push(el("div", { class: `lt-lbl ${n.label}${isEnd ? " end" : ""}`, style, title: n.name },
      ...(n.label === "left" ? [...chips, " ", n.name] : [n.name, ...chips])));
  }
  const track = el("div", { class: "lt", style: `height:${h}px` }, svg, ...labels);

  const now = Date.now() / 1000;
  const outside = [];
  const rows = tabRows(tab);
  for (const r of rows) {
    const p = treePlace(tree, g, tab, r, now);
    if (p) track.append(vehButton(r, p.x, p.y, p.dir, true));
    else if (r.status !== "cancelled") outside.push(r);
  }
  lvGeom = { kind: "tree", tree, g, tab };
  return {
    head: [el("div", { class: "lv-title" }, el("strong", { text: TAB_NAMES[current] }),
      el("span", { text: `Linjerna ${tab.lines.map((l) => l.line).join(", ")} · ${tab.count} i trafik (${tab.planned} enligt tidtabell)` }))],
    legend: ["▲ norrut", "Välj linje ovan för detaljer", "▼ söderut"],
    track, outside,
  };
}

function gotoTable() {
  const b = el("button", { type: "button", class: "goto", text: "Visa i tabellen" });
  b.addEventListener("click", () => setView("table"));
  return b;
}

function lastRowById(id) {
  const tab = last?.tabs[current];
  return tab ? tabRows(tab).find((r) => r.trip_id === id) : null;
}

/* Flytta tågen mjukt mellan uppdateringarna. */
function tickPositions() {
  if (!last || $("lv").hidden || !lvGeom) return;
  const now = Date.now() / 1000;
  for (const btn of document.querySelectorAll(".lv-veh")) {
    const r = lastRowById(btn.dataset.trip);
    if (!r) continue;
    if (lvGeom.kind === "line") {
      const p = place(lvGeom.pat, r, now);
      if (p) btn.style.top = `${p.pos * ROW + ROW / 2}px`;
    } else {
      const p = treePlace(lvGeom.tree, lvGeom.g, lvGeom.tab, r, now);
      if (p) { btn.style.top = `${p.y}px`; btn.style.left = `${p.x}px`; }
    }
  }
}

function setLv(show) {
  $("showLv").checked = show;
  store(LV_KEY, show ? "1" : "0");
  renderLv();
}

/* ---------- Val av avgång (synkat mellan tabell och linjevy) ---------- */

function selectTrip(id, source) {
  selected = selected === id ? null : id;
  const tab = last?.tabs[current];
  const r = selected && tab ? tabRows(tab).find((x) => x.trip_id === selected) : null;
  applySelection();
  renderLv();
  if (!selected) return;
  const behavior = reducedMotion ? "auto" : "smooth";
  if (NARROW.matches) return;   // smala skärmar: bara en vy syns, den andra centreras vid växling
  if (source === "lv") {
    document.querySelector(`tr.veh[data-trip="${CSS.escape(selected)}"]`)?.scrollIntoView({ block: "center", behavior });
  } else {
    centerSelectedMarker(behavior);
  }
}

function applySelection() {
  for (const tr of document.querySelectorAll("tr.veh")) {
    const on = tr.dataset.trip === selected;
    tr.classList.toggle("selected", on);
    if (on) tr.setAttribute("aria-current", "true"); else tr.removeAttribute("aria-current");
  }
}

$("board").addEventListener("click", (e) => {
  const tr = e.target.closest("tr.veh");
  if (tr) selectTrip(tr.dataset.trip, "table");
});
$("board").addEventListener("keydown", (e) => {
  const tr = e.target.closest("tr.veh");
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selectTrip(tr.dataset.trip, "table"); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && selected) { selected = null; applySelection(); renderLv(); }
});

/* ---------- Övrigt ---------- */

function renderFreshness() {
  const f = $("freshness");
  if (lastError && !last) { f.textContent = ""; return; }
  if (!last?.feed_timestamp) { f.textContent = loading ? "Hämtar…" : ""; return; }
  const age = Math.round(Date.now() / 1000 - last.feed_timestamp);
  const stale = age > last.max_age_seconds;
  f.textContent = `Data från ${fmtSec.format(new Date(last.feed_timestamp * 1000))} (${age} s sedan)`
    + (stale ? " – inaktuell" : "") + (lastError ? ` – ${lastError}` : "");
  f.classList.toggle("stale", stale || !!lastError);
}

function render() {
  renderTabs();
  const isBus = current === "BUS";
  for (const id of ["summary", "alerts", "toolbar", "main"]) $(id).hidden = isBus;
  $("bus").hidden = !isBus;
  if (isBus) { window.BusView.render(); renderFreshness(); return; }
  if (!last) { renderLv(); return; }
  const tab = last.tabs[current];
  if (!tab) return;
  if (selected && !tabRows(tab).some((r) => r.trip_id === selected)) selected = null;   // tåget har försvunnit
  document.documentElement.style.setProperty("--line", TAB_COLOR[current] || "#1c4e80");
  // På röda linjen skulle ett rött tåg i tid se ut som kraftigt försenat: pilar i textfärg där.
  document.documentElement.style.setProperty("--arrow", current === "TB2" ? "var(--ink)" : "var(--line)");
  renderSummary(tab);
  renderAlerts(tab);
  renderBoard(tab);
  applySelection();
  renderLv();
  renderFreshness();
}

async function load() {
  clearTimeout(timer);
  if (loading) return;
  loading = true;
  renderFreshness();
  try {
    const res = await fetch("/api/board");
    const data = await res.json();
    if (!res.ok) {
      lastError = data.code === "budget" ? "Månadens API-kvot är slut." : (data.error || "Kunde inte hämta data.");
      if (!last) $("board").replaceChildren(el("div", { class: "message error", text: lastError + " Försöker igen strax." }));
    } else {
      last = data;
      lastError = null;
      store(CACHE_KEY, JSON.stringify(data));
      render();
    }
  } catch (e) {
    lastError = "servern svarar inte";
    if (!last) $("board").replaceChildren(el("div", { class: "message error", text: "Servern svarar inte. Försöker igen strax." }));
  } finally {
    loading = false;
    renderFreshness();
    timer = setTimeout(load, REFRESH_MS);
  }
}

function select(code, focus = false) {
  if (!TAB_NAMES[code]) code = "PT";
  if (code !== current) selected = null;
  current = code;
  history.replaceState(null, "", "#" + code);
  if (code === "BUS") window.BusView.start(); else window.BusView.stop();
  render();   // data för alla flikar finns redan, inget nytt anrop behövs
  if (focus) $("tab-" + code)?.focus();
}

$("tabs").addEventListener("keydown", (e) => {
  if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const codes = Object.keys(TAB_NAMES);
  const i = codes.indexOf(current);
  e.preventDefault();
  select(codes[(i + (e.key === "ArrowRight" ? 1 : -1) + codes.length) % codes.length], true);
});
for (const id of ["onlyDeviations", "sortByDelay"]) $(id).addEventListener("change", render);
$("showLv").addEventListener("change", (e) => setLv(e.target.checked));
setInterval(renderFreshness, 5000);
setInterval(tickPositions, 3000);
window.addEventListener("hashchange", () => {
  const code = location.hash.slice(1);
  if (code !== current && TAB_NAMES[code]) select(code);
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && last && Date.now() / 1000 - last.generated_at > REFRESH_MS / 1000) load();
});

// Breda skärmar: linjevyn är på som standard. Smala: tabellen visas först. Valen sparas.
const savedLv = recall(LV_KEY);
$("showLv").checked = savedLv == null ? true : savedLv === "1";
narrowView = recall(VIEW_KEY) === "lv" ? "lv" : "table";
for (const b of document.querySelectorAll(".viewswitch button")) b.addEventListener("click", () => setView(b.dataset.view));
NARROW.addEventListener("change", renderLv);
// Visa senaste data från förra besöket direkt (om den är färsk nog), hämta sedan nytt.
last = readCache();
if (last && !Object.values(last.tabs)[0]?.lines) last = null;   // cache från äldre version
select(location.hash.slice(1));
load();
</script>
</body>
</html>
